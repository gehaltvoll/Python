<style>
/* Layout: eine Lesespalte, oben die Beispielreihe mit Nummern. Figuren haben feste Farben und Formen. */
:root{
  --nord0:#2E3440;--nord1:#3B4252;--nord2:#434C5E;--nord3:#4C566A;

  --bg:var(--nord0);--surface:var(--nord1);--surface-2:var(--nord2);--line:var(--nord2);
  --text:var(--nord6);--muted:var(--nord4);--accent:var(--nord8);
  --ok:var(--nord14);--bad:var(--nord11);--special:var(--nord15);
  --q:var(--nord8);--d:var(--nord13);--k:var(--nord15);
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Google Sans Code",ui-monospace,"Cascadia Code",Consolas,"SF Mono",monospace;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,p,ol,ul,table{margin:0}
code,.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 72px;display:flex;flex-direction:column;gap:28px}

.top{display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--nord7)}
h1{font-size:clamp(32px,7vw,48px);font-weight:700;line-height:1.15;text-wrap:balance}
.lead{color:var(--muted);max-width:66ch}
.counter{font-family:var(--mono);font-size:15px;background:var(--surface);padding:8px 12px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.counter b{font-weight:600;color:var(--ok)}
.counter span{color:var(--muted)}

/* Figuren */
.fg{display:block;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:4px}
.slot{width:var(--s,42px);display:flex;flex-direction:column;align-items:center;gap:2px}
.cellbox{width:var(--s,42px);height:var(--s,42px);padding:5px;border-radius:5px;background:var(--surface);position:relative}
.cellbox.next{box-shadow:inset 0 0 0 2px var(--accent)}
.cellbox.wrong{box-shadow:inset 0 0 0 2px var(--bad)}
.cellbox.new{box-shadow:inset 0 0 0 2px var(--nord13)}
.slot .xn{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.slot .mk{font-family:var(--mono);font-size:12px;line-height:1.2;color:var(--nord4);min-height:1.2em}
.hero{--s:clamp(30px,8.4vw,60px)}
.hero .cellbox{background:transparent;padding:3px}
.rowlabel{font-size:14px;color:var(--muted);margin-bottom:4px}

/* Navigation */
.tabs ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tabs a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--muted);padding:8px;border-radius:5px;background:var(--surface);min-height:100%}
.tabs a:hover{color:var(--text);background:var(--surface-2)}
.tabs a[aria-current="page"]{color:var(--text);box-shadow:inset 0 -3px 0 var(--accent);background:var(--surface-2)}
.tabs .nm{font-size:14px;line-height:1.25;font-weight:600}
.tabs .pr{font-family:var(--mono);font-size:12px}
.tabs .bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;display:block}
.tabs .bar i{display:block;height:100%;background:var(--ok);width:var(--p,0%);transition:width .25s}
@media (max-width:480px){.tabs a{padding:6px}.tabs .nm{font-size:12px}}

/* Text */
.sect{display:flex;flex-direction:column;gap:16px}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--nord7)}
h2{font-size:clamp(26px,5vw,34px);font-weight:700;line-height:1.2;text-wrap:balance}
.sect p{max-width:68ch}
p code,.merke code,.fb code,.note code,.opt code{font-size:.9em;background:var(--surface);padding:.1em .32em;border-radius:3px}

.tbl{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:center}
th{font-weight:600;text-align:left;color:var(--muted)}
td.hi{background:rgba(136,192,208,.2)}

.prog{background:var(--surface);border-radius:6px;padding:10px 0;font-family:var(--mono);font-size:15px;line-height:1.5;overflow-x:auto}
.pl{padding:2px 14px;white-space:pre;min-width:max-content;min-height:32px;line-height:28px}

.k{color:var(--nord9)}.n{color:var(--nord15)}

.figb{display:inline-block;border:1px dashed var(--nord9);background:var(--bg);border-radius:4px;width:34px;height:34px;padding:4px;cursor:pointer;color:var(--muted);line-height:1}

.btn:hover{background:var(--nord7)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border-color:var(--nord3);color:var(--text);font-weight:400}

.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pal{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.palb{width:52px;height:52px;padding:8px;border:0;border-radius:6px;background:var(--surface);cursor:pointer}
.palb:hover{background:var(--surface-2)}

.ex{padding-block:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.exh{display:flex;gap:10px;align-items:baseline;font-family:var(--mono);font-size:13px;color:var(--muted)}
.exh .id{font-weight:600;color:var(--text)}
.exh .st{margin-left:auto;color:var(--ok)}
.q{max-width:68ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;border:0;padding:0;margin:0}
.opt{display:flex;flex-direction:column;gap:6px;cursor:pointer;border-radius:6px;padding:8px;background:var(--bg);border:1px solid var(--nord3);min-width:0}
.opt:has(input:checked){border-color:var(--accent)}
.opt .lab{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.opt input{accent-color:var(--nord8)}
.opt .prog{font-size:14px}
.opt .pl{min-height:26px;line-height:26px;padding:0 10px}
.fb{padding:10px 14px;border-radius:6px;max-width:68ch}
.fb.ok{background:rgba(163,190,140,.2)}
.fb.no{background:rgba(191,97,106,.24)}
.fb.sol{background:var(--surface)}

.sim{background:var(--surface);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sim h3{font-size:17px;font-weight:600}
.sim .prog{background:var(--bg)}

.simg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.simg>div{min-width:0}
.sim .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.xbox{background:var(--bg);border-radius:6px;padding:6px 14px;display:inline-block;font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:96px}
.note{min-height:3.2em;max-width:none}
.note code{background:var(--bg)}
.simbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.simbar .pos{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:6px 12px;border-radius:5px;border:1px solid var(--nord3);background:transparent;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--nord0);border-color:var(--accent);font-weight:600}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .lb{font-size:14px;color:var(--muted)}
.ctls{display:flex;flex-wrap:wrap;gap:12px 28px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.eyebrow a.back{color:var(--nord7);text-decoration:none}.eyebrow a.back:hover{text-decoration:underline}
</style>
</head>

: {"k": "mod", "m": 3, "r": 0}, "fig": "D"}], "other": "Q", "incFirst": false}, "alt": [{"start": 1, "n": 6, "br": [{"c": {"k": "mod", "m": 2, "r": 0}, "fig": "D"}], "other": "Q", "incFirst": false}, {"start": 1, "n": 6, "br": [{"c": {"k": "mod", "m": 3, "r": 1}, "fig": "D"}], "other": "Q", "incFirst": false}], "id": "3.2", "q": "Welches Programm erzeugt diese Reihe?", "row": "QQDQQD"}, {"t": "bauen", "p": {"start": 1, "n": 6, "br": [{"c": {"k": "mod", "m": 2, "r": 0}, "fig": "D"}], "other": "Q", "incFirst": false}, "blanks": ["b0.m", "b0.r"], "id": "3.3", "q": "Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt.", "row": "QDQDQD"}, {"t": "legen", "p": {"start": 1, "n": 9, "br": [{"c": {"k": "mod", "m": 3, "r": 0}, "fig": "K"}], "other": "D", "incFirst": false}, "id": "3.4", "q": "Spielen Sie das Programm in Gedanken durch und legen Sie die Reihe, die es erzeugt.", "row": "DDKDDKDDK"}, {"t": "bauen", "p": {"start": 1, "n": 8, "br": [{"c": {"k": "mod", "m": 4, "r": 0}, "fig": "K"}], "other": "Q", "incFirst": false}, "blanks": ["b0.m", "b0.r"], "id": "3.5", "q": "Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt.", "row": "QQQKQQQK"}, {"t": "bauen", "p": {"start": 1, "n": 9, "br": [{"c": {"k": "mod", "m": 3, "r": 1}, "fig": "D"}], "other": "K", "incFirst": false}, "blanks": ["b0.m", "b0.r", "b0.fig", "other"], "id": "3.6", "q": "Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt.", "row": "DKKDKKDKK"}], "simRow": "QQDQQD"}, {"id": "stufe-4", "name": "Drei Figuren", "niveau": "schwierig", "titel": "Drei Figuren, mehrere Regeln", "intro": ["Bei drei Figuren reicht eine einzige Entscheidung nicht. Mit <code>elif<\/code> folgt eine zweite Bedingung. Python prüft von oben nach unten und nimmt die erste, die stimmt. Der Rest landet im <code>else<\/code>.", "Am Schluss wird es knifflig: Auch der Startwert von <code>x<\/code> und die Stelle von <code>x = x + 1<\/code> verändern das Ergebnis."], "sim": {"start": 1, "n": 6, "br": [{"c": {"k": "mod", "m": 3, "r": 1}, "fig": "Q"}, {"c": {"k": "mod", "m": 3, "r": 2}, "fig": "D"}], "other": "K", "incFirst": false}, "merke": "Sobald eine Bedingung stimmt, überspringt Python alle weiteren. Darum genügt bei <code>elif x &lt;= 5<\/code> die obere Grenze.", "ex": [{"t": "legen", "p": {"start": 1, "n": 9, "br": [{"c": {"k": "mod", "m": 3, "r": 1}, "fig": "Q"}, {"c": {"k": "mod", "m": 3, "r": 2}, "fig": "D"}], "other": "K", "incFirst": false}, "id": "4.1", "q": "Spielen Sie das Programm in Gedanken durch und legen Sie die Reihe, die es erzeugt.", "row": "QDKQDKQDK"}, {"t": "bauen", "p": {"start": 1, "n": 6, "br": [{"c": {"k": "mod", "m": 3, "r": 1}, "fig": "Q"}, {"c": {"k": "mod", "m": 3, "r": 2}, "fig": "D"}], "other": "K", "incFirst": false}, "blanks": ["b0.r", "b1.r", "b0.fig", "b1.fig", "other"], "id": "4.2", "q": "Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt.", "row": "QDKQDK"}, {"t": "legen", "p": {"start": 1, "n": 8, "br": [{"c": {"k": "le", "a": 3}, "fig": "Q"}, {"c": {"k": "le", "a": 5}, "fig": "D"}], "other": "K", "incFirst": false}, "id": "4.3", "q": "Spielen Sie das Programm in Gedanken durch und legen Sie die Reihe, die es erzeugt.", "row": "QQQDDKKK"}, {"t": "bauen", "p": {"start": 1, "n": 8, "br": [{"c": {"k": "le", "a": 2}, "fig": "Q"}, {"c": {"k": "le", "a": 5}, "fig": "D"}], "other": "K", "incFirst": false}, "blanks": ["b0.a", "b1.a", "other"], "id": "4.4", "q": "Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt.", "row": "QQDDDKKK"}, {"t": "legen", "p": {"start": 0, "n": 12, "br": [{"c": {"k": "modlt", "m": 6, "r": 3}, "fig": "Q"}], "other": "D", "incFirst": false}, "id": "4.5", "q": "Spielen Sie das Programm in Gedanken durch und legen Sie die Reihe, die es erzeugt.", "row": "QQQDDDQQQDDD"}, {"t": "bauen", "p": {"start": 0, "n": 12, "br": [{"c": {"k": "modlt", "m": 6, "r": 3}, "fig": "Q"}], "other": "D", "incFirst": false}, "blanks": ["b0.m", "b0.r"], "id": "4.6", "q": "Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt.", "row": "QQQDDDQQQDDD"}, {"t": "legen", "q": "Hier steht <code>x = x + 1<\/code> oben in der Schleife. Legen Sie die Reihe.", "p": {"start": 0, "n": 7, "br": [{"c": {"k": "mod", "m": 2, "r": 0}, "fig": "D"}], "other": "Q", "incFirst": true}, "id": "4.7", "row": "QDQDQDQ"}], "simRow": "QDKQDK"}]</script>
<script>
(function(){
const STUFEN=JSON.parse(document.getElementById("daten").textContent),KEY="figurenmuster-v1";
const TOTAL=STUFEN.reduce((a,s)=>a+s.ex.length,0);
const NAME={Q:"Quadrat",D:"Dreieck",K:"Kreis"},FIGS=["Q","D","K"];
const MIT={Q:"ein Quadrat",D:"ein Dreieck",K:"einen Kreis"};
const TYP={legen:"Reihe legen",bauen:"Programm ergänzen",wahl:"Programm wählen"};
let solved={};
try{solved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){solved={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(solved))}catch(e){}}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function btn(t,c,f){const b=el("button",c===null?"":(c||"btn"),t);b.type="button";if(f)b.addEventListener("click",f);return b}
function clone(o){return JSON.parse(JSON.stringify(o))}
function svg(f){
  const s={Q:'<rect x="3" y="3" width="18" height="18" rx="1" fill="var(--q)"/>',D:'<polygon points="12,3 22.5,21 1.5,21" fill="var(--d)"/>',K:'<circle cx="12" cy="12" r="9.5" fill="var(--k)"/>'}[f];
  return '<svg class="fg" viewBox="0 0 24 24" role="img" aria-label="'+NAME[f]+'">'+s+'</svg>';
}

/* Programm-Modell */
function test(c,x){
  switch(c.k){
    case"le":return x<=c.a;case"gt":return x>c.a;
    case"between":return x>c.a&&x<=c.b;case"outside":return x<=c.a||x>c.b;
    case"mod":return x%c.m===c.r;case"modlt":return x%c.m<c.r;
  }
}
function pick(p,x){for(let i=0;i<p.br.length;i++)if(test(p.br[i].c,x))return{i,fig:p.br[i].fig};return{i:-1,fig:p.other}}
function makeRow(p){let x=p.start,r="";for(let i=0;i<p.n;i++){if(p.incFirst)x++;r+=pick(p,x).fig;if(!p.incFirst)x++}return r}
function complete(p){
  if(p.n==null||p.start==null||p.other==null)return false;
  return p.br.every(b=>b.fig!=null&&Object.values(b.c).every(v=>v!=null)&&(b.c.m==null||b.c.m>0));
}
function getP(p,path){if(path==="n"||path==="start"||path==="other")return p[path];const[b,f]=path.split(".");const br=p.br[+b.slice(1)];return f==="fig"?br.fig:br.c[f]}
function setP(p,path,v){if(path==="n"||path==="start"||path==="other"){p[path]=v;return}const[b,f]=path.split(".");const br=p.br[+b.slice(1)];if(f==="fig")br.fig=v;else br.c[f]=v}
const RANGE={n:[1,16],start:[0,2],a:[0,16],b:[0,16],m:[2,8],r:[0,7]};

/* Darstellung eines Programms: ctx.blanks = editierbare Pfade, ctx.on = aktive Zeile */
function renderProg(p,ctx){
  ctx=ctx||{};const blanks=ctx.blanks||[],w=el("div","prog");
  const num=(path)=>{
    const v=getP(p,path);
    if(!blanks.includes(path))return '<span class="n">'+v+'</span>';
    return '<span data-b="'+path+'"></span>';
  };
  const fig=(path)=>{
    if(!blanks.includes(path))return '<span class="fi">'+svg(getP(p,path))+'</span>';
    return '<span data-f="'+path+'"></span>';
  };
  const cond=(i)=>{
    const c=p.br[i].c,a=(f)=>num("b"+i+"."+f),K=(s)=>'<span class="k">'+s+'</span>';
    return {le:()=>"x &lt;= "+a("a"),gt:()=>"x &gt; "+a("a"),
      between:()=>"x &gt; "+a("a")+" "+K("and")+" x &lt;= "+a("b"),
      outside:()=>"x &lt;= "+a("a")+" "+K("or")+" x &gt; "+a("b"),
      mod:()=>"x % "+a("m")+" == "+a("r"),modlt:()=>"x % "+a("m")+" &lt; "+a("r")}[c.k]();
  };
  const L=[];
  L.push(["start","x = "+num("start")]);
  L.push(["rep",'<span class="k">repeat</span> '+num("n")+":"]);
  if(p.incFirst)L.push(["inc",'    x = x + <span class="n">1</span>']);
  p.br.forEach((b,i)=>{
    L.push(["if"+i,'    <span class="k">'+(i?"elif":"if")+'</span> '+cond(i)+":"]);
    L.push(["fig"+i,"        "+fig("b"+i+".fig")]);
  });
  L.push(["else",'    <span class="k">else</span>:']);
  L.push(["figE","        "+fig("other")]);
  if(!p.incFirst)L.push(["inc",'    x = x + <span class="n">1</span>']);
  L.forEach(([id,h])=>{const d=el("div","pl"+(ctx.on===id?" on":""),h);d.dataset.id=id;w.append(d)});
  w.querySelectorAll("[data-b]").forEach(s=>{
    const path=s.dataset.b,key=path.includes(".")?path.split(".")[1]:path,[lo,hi]=RANGE[key];
    const box=el("span","blank"),v=el("span","v");
    const draw=()=>{const c=getP(p,path);v.textContent=c==null?"?":c;box.classList.toggle("empty",c==null)};
    const step=d=>{const c=getP(p,path);setP(p,path,c==null?(d>0?lo:hi):Math.min(hi,Math.max(lo,c+d)));draw()};
    const m=btn("−",null,()=>step(-1)),q=btn("+",null,()=>step(1));
    m.setAttribute("aria-label","Wert verkleinern");q.setAttribute("aria-label","Wert vergrössern");
    box.append(m,v,q);draw();s.replaceWith(box);
  });
  w.querySelectorAll("[data-f]").forEach(s=>{
    const path=s.dataset.f;
    const b=btn("?","figb",()=>{const c=getP(p,path);setP(p,path,FIGS[(FIGS.indexOf(c)+1)%3]);draw()});
    const draw=()=>{const c=getP(p,path);b.innerHTML=c?svg(c):"?";b.setAttribute("aria-label",c?"Figur "+NAME[c]+", klicken zum Wechseln":"Figur wählen")};
    draw();s.replaceWith(b);
  });
  return w;
}
function slot(i,f,o){
  o=o||{};const s=el("div","slot");
  const c=el("div","cellbox"+(o.cls?" "+o.cls:""));if(f)c.innerHTML=svg(f);
  s.append(c);if(o.x!==false)s.append(el("span","xn",String(o.x||i+1)));
  if(o.mk!=null)s.append(el("span","mk",o.mk));
  return s;
}
function rowEl(str,o){
  o=o||{};const r=el("div","row");
  for(let i=0;i<(o.len||str.length);i++)r.append(slot(i,str[i],{x:o.x&&o.x(i),cls:o.cls&&o.cls(i),mk:o.mk&&o.mk(i)}));
  r.setAttribute("aria-label","Reihe: "+Array.from(str).map(f=>NAME[f]).join(", "));
  return r;
}

/* Ablauf */
function frames(p){
  const F=[];let x=p.start,row="";
  const add=(on,note,extra)=>F.push(Object.assign({on,note,x,row},extra||{}));
  add(null,"Das Programm startet. Die Reihe ist noch leer. Klicken Sie auf <b>Weiter</b>.",{x:null});
  add("start","Der Zähler <code>x</code> erhält den Startwert "+x+".");
  const explain=(c)=>{
    const r=test(c,x)?"Ja":"Nein";
    if(c.k==="mod")return "<code>x</code> ist "+x+", also ist <code>x % "+c.m+"</code> gleich "+(x%c.m)+". Ist das "+c.r+"? <b>"+r+".</b>";
    if(c.k==="modlt")return "<code>x</code> ist "+x+", also ist <code>x % "+c.m+"</code> gleich "+(x%c.m)+". Ist das kleiner als "+c.r+"? <b>"+r+".</b>";
    const t={le:"x &lt;= "+c.a,gt:"x &gt; "+c.a,between:"x &gt; "+c.a+" and x &lt;= "+c.b,outside:"x &lt;= "+c.a+" or x &gt; "+c.b}[c.k];
    return "<code>x</code> ist "+x+". Stimmt <code>"+t+"</code>? <b>"+r+".</b>";
  };
  const inc=()=>{const o=x;x++;add("inc","<code>x = x + 1</code>: Aus "+o+" wird "+x+".")};
  for(let k=1;k<=p.n;k++){
    add("rep","<b>Durchlauf "+k+" von "+p.n+".</b>");
    if(p.incFirst)inc();
    let done=false;
    for(let i=0;i<p.br.length&&!done;i++){
      add("if"+i,explain(p.br[i].c));
      if(test(p.br[i].c,x)){row+=p.br[i].fig;add("fig"+i,"Die Reihe erhält "+MIT[p.br[i].fig]+".",{fresh:true});done=true}
    }
    if(!done){add("else","Keine Bedingung stimmt, also gilt <code>else</code>.");row+=p.other;add("figE","Die Reihe erhält "+MIT[p.other]+".",{fresh:true})}
    if(!p.incFirst)inc();
  }
  add(null,"Alle Durchläufe sind fertig. Die Reihe ist vollständig.");
  return F;
}
function simWidget(p,title){
  const F=frames(p);let i=0;
  const w=el("section","sim");w.setAttribute("aria-label",title);w.append(el("h3",null,title));
  const g=el("div","simg"),a=el("div"),b=el("div");
  a.innerHTML='<div class="lbl">Programm</div>';b.innerHTML='<div class="lbl">Zähler x</div>';
  const pw=el("div"),xb=el("div","xbox"),rl=el("div","lbl","Reihe"),rw=el("div");rl.style.marginTop="12px";
  a.append(pw);b.append(xb,rl,rw);g.append(a,b);
  const note=el("p","note");note.setAttribute("aria-live","polite");
  const back=btn("Zurück","btn ghost",()=>go(i-1)),next=btn("Weiter","btn",()=>go(i+1)),again=btn("Von vorne","btn ghost",()=>go(0)),pos=el("span","pos");
  const bar=el("div","simbar");bar.append(back,next,again,pos);w.append(g,note,bar);
  function go(n){
    i=Math.max(0,Math.min(F.length-1,n));const f=F[i];
    pw.replaceChildren(renderProg(p,{on:f.on}));
    xb.textContent=f.x==null?"noch leer":f.x;
    rw.replaceChildren(rowEl(f.row,{len:p.n,cls:k=>f.fresh&&k===f.row.length-1?"new":k===f.row.length?"next":""}));
    rw.style.setProperty("--s","34px");
    note.innerHTML=f.note;pos.textContent="Schritt "+i+" von "+(F.length-1);
    back.disabled=i===0;next.disabled=i===F.length-1;
  }
  go(0);return w;
}

/* Fortschritt */
function nSolved(){return Object.keys(solved).length}
function counter(flash){
  const c=document.getElementById("counter"),plain='geloest = <b>'+nSolved()+'</b> <span># von '+TOTAL+'</span>';
  if(flash){c.innerHTML="geloest = geloest + 1";clearTimeout(counter.t);counter.t=setTimeout(()=>c.innerHTML=plain,1100)}else c.innerHTML=plain;
}
function tabs(){
  const ol=document.getElementById("tabs");ol.innerHTML="";
  STUFEN.forEach((s,i)=>{
    const d=s.ex.filter(e=>solved[e.id]).length,li=el("li"),a=el("a");a.href="#"+s.id;
    if(s.id===cur)a.setAttribute("aria-current","page");
    a.setAttribute("aria-label","Stufe "+(i+1)+", "+s.name+", "+d+" von "+s.ex.length+" gelöst");
    a.innerHTML='<span class="pr">'+(i+1)+' · '+d+'/'+s.ex.length+'</span><span class="nm">'+s.name+'</span><span class="bar"><i style="--p:'+d/s.ex.length*100+'%"></i></span>';
    li.append(a);ol.append(li);
  });
  const li=el("li"),a=el("a");a.href="#generator";if(cur==="generator")a.setAttribute("aria-current","page");
  a.innerHTML='<span class="pr">neu</span><span class="nm">Generator</span>';li.append(a);ol.append(li);
}
function setSolved(e,art){
  if(!e.id||solved[e.id])return;
  solved[e.id]=1;save();art.querySelector(".st").textContent="✓ gelöst";counter(true);tabs();
}

/* Aufgaben */
function feedback(art){const f=el("div","fb");f.hidden=true;f.setAttribute("role","status");art.append(f);return f}
function show(f,k,h){f.className="fb "+k;f.innerHTML=h;f.hidden=false}
function afterSolve(art,p,hold){
  if(art.querySelector(".abl"))return;
  const b=btn("Ablauf ansehen","btn ghost abl",function(){
    const open=hold.firstChild;
    hold.replaceChildren();if(!open)hold.append(simWidget(p(),"Ablauf"));
    this.textContent=open?"Ablauf ansehen":"Ablauf ausblenden";
  });
  art.querySelector(".acts").append(b);
}
function renderTask(e,onOk){
  const art=el("article","ex");if(e.id)art.id="ex-"+e.id.replace(".","-");
  art.innerHTML='<div class="exh"><span class="id">'+(e.id||"neu")+'</span><span>'+TYP[e.t]+'</span><span class="st">'+(e.id&&solved[e.id]?"✓ gelöst":"")+'</span></div>';
  art.append(el("p","q",e.q));
  const ok=()=>{setSolved(e,art);if(onOk)onOk()};
  ({legen:rLegen,bauen:rBauen,wahl:rWahl})[e.t](e,art,ok);
  return art;
}
function rLegen(e,art,ok){
  const target=e.row,n=target.length;let cur2="",wrong=-1;
  art.append(renderProg(e.p));
  const rw=el("div"),pal=el("div","pal");
  const draw=()=>rw.replaceChildren(rowEl(cur2,{len:n,x:i=>"",cls:i=>i===wrong?"wrong":i===cur2.length?"next":""}));
  FIGS.forEach(f=>{const b=btn(svg(f),"palb",()=>{if(cur2.length<n){cur2+=f;wrong=-1;draw()}});b.setAttribute("aria-label",NAME[f]+" anhängen");pal.append(b)});
  pal.append(btn("Letzte entfernen","btn ghost",()=>{cur2=cur2.slice(0,-1);wrong=-1;draw()}),btn("Alles leeren","btn ghost",()=>{cur2="";wrong=-1;draw()}));
  art.append(el("div","rowlabel","Ihre Reihe"));art.lastChild.style.marginBottom="-8px";
  art.append(rw,pal);draw();
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  acts.append(btn("Prüfen","btn",()=>{
    if(cur2.length<n){show(box,"no","Die Reihe hat "+n+" Figuren. Legen Sie zuerst alle Figuren.");return}
    if(cur2===target){wrong=-1;draw();show(box,"ok","<b>✓ Richtig.</b> Das Programm erzeugt genau diese Reihe.");ok();afterSolve(art,()=>e.p,hold)}
    else{wrong=[...cur2].findIndex((f,i)=>f!==target[i]);draw();show(box,"no","<b>✗ Figur "+(wrong+1)+" stimmt nicht.</b> Überlegen Sie, welchen Wert <code>x</code> an dieser Stelle hat.")}
  }),btn("Lösung zeigen","btn ghost",()=>{cur2=target;wrong=-1;draw();show(box,"sol","Dies ist die richtige Reihe. Sehen Sie im Ablauf nach, wie sie entsteht.");afterSolve(art,()=>e.p,hold)}));
}
function rBauen(e,art,ok){
  const p=clone(e.p);e.blanks.forEach(b=>setP(p,b,null));
  art.append(el("div","rowlabel","Vorlage"),rowEl(e.row));art.children[2].style.marginBottom="-8px";
  art.append(renderProg(p,{blanks:e.blanks}));
  const res=el("div");art.append(res);
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  const sync=()=>{art.querySelectorAll(".prog").forEach(x=>{if(x.parentNode===art)x.replaceWith(renderProg(p,{blanks:e.blanks}))})};
  acts.append(btn("Prüfen","btn",()=>{
    if(!complete(p)){show(box,"no","Füllen Sie zuerst alle Felder mit dem Fragezeichen aus.");res.replaceChildren();return}
    const r=makeRow(p),t=e.row;let d=-1;
    for(let i=0;i<Math.max(r.length,t.length);i++)if(r[i]!==t[i]){d=i;break}
    const lab=el("div","rowlabel","Ihr Programm erzeugt");
    res.replaceChildren(lab,rowEl(r,{cls:i=>i===d?"wrong":""}));
    if(d<0){show(box,"ok","<b>✓ Richtig.</b> Ihr Programm erzeugt genau die Vorlage.");ok();afterSolve(art,()=>clone(p),hold)}
    else if(r.length!==t.length)show(box,"no","<b>✗ Die Länge stimmt nicht.</b> Die Vorlage hat "+t.length+" Figuren, Ihr Programm erzeugt "+r.length+".");
    else show(box,"no","<b>✗ Ab Figur "+(d+1)+" weicht die Reihe ab.</b> Welchen Wert hat <code>x</code> dort?");
  }),btn("Lösung zeigen","btn ghost",()=>{
    e.blanks.forEach(b=>setP(p,b,getP(e.p,b)));sync();res.replaceChildren();
    show(box,"sol","Dies ist eine richtige Lösung. Andere Lösungen sind möglich, wenn sie dieselbe Reihe erzeugen.");afterSolve(art,()=>clone(p),hold);
  }));
}
function seed(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rWahl(e,art,ok){
  art.append(rowEl(e.row));
  const list=[e.p].concat(e.alt).map((p,i)=>({p,i}));
  list.sort((a,b)=>seed(e.id+a.i)-seed(e.id+b.i));
  const fs=el("fieldset","opts"),leg=el("legend",null,"Programm wählen"),name="w"+e.id.replace(".","_");
  leg.style.cssText="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)";fs.append(leg);
  list.forEach((o,k)=>{
    const l=el("label","opt"),r=el("input");r.type="radio";r.name=name;r.value=o.i;r.id=name+"_"+k;
    const t=el("span","lab");t.append(r,document.createTextNode("Programm "+"ABC"[k]));
    l.append(t,renderProg(o.p));fs.append(l);
  });
  art.append(fs);
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  acts.append(btn("Prüfen","btn",()=>{
    const c=fs.querySelector("input:checked");
    if(!c){show(box,"no","Wählen Sie zuerst ein Programm.");return}
    if(+c.value===0){show(box,"ok","<b>✓ Richtig.</b> Dieses Programm erzeugt die Reihe.");ok();afterSolve(art,()=>e.p,hold)}
    else show(box,"no","<b>✗ Dieses Programm erzeugt eine andere Reihe:</b>"),box.append(rowEl(makeRow(e.alt[+c.value-1])));
  }));
}

/* Generator */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function two(){const f=FIGS.slice().sort(()=>Math.random()-.5);return f}
function genProg(level){
  const f=two();
  const mk=(n,br,o,s)=>({start:s==null?1:s,n,br,other:o,incFirst:false});
  if(level===1){const n=ri(5,10);return [mk(n,[{c:{k:"le",a:ri(2,n-1)},fig:f[0]}],f[1]),["n","b0.a"]]}
  if(level===2){
    const n=ri(7,12),a=ri(1,n-4),b=ri(a+2,n-1);
    if(Math.random()<.5)return [mk(n,[{c:{k:"between",a,b},fig:f[0]}],f[1]),["b0.a","b0.b"]];
    return [mk(n,[{c:{k:"outside",a,b},fig:f[0]}],f[1]),["b0.a","b0.b"]];
  }
  if(level===3){
    const m=ri(2,4),r=ri(0,m-1),n=ri(2,3)*m+ri(0,m-1);
    return [mk(n,[{c:{k:"mod",m,r},fig:f[0]}],f[1]),["b0.m","b0.r"]];
  }
  const t=ri(1,3);
  if(t===1){const n=3*ri(2,4),a=ri(0,2);let b=ri(0,2);while(b===a)b=ri(0,2);return [mk(n,[{c:{k:"mod",m:3,r:a},fig:f[0]},{c:{k:"mod",m:3,r:b},fig:f[1]}],f[2]),["b0.r","b1.r","other"]]}
  if(t===2){const n=ri(7,11),a=ri(1,3),b=ri(a+2,n-2);return [mk(n,[{c:{k:"le",a},fig:f[0]},{c:{k:"le",a:b},fig:f[1]}],f[2]),["b0.a","b1.a","other"]]}
  const g=ri(2,3),n=2*g*(g===3?2:ri(2,3));return [mk(n,[{c:{k:"modlt",m:2*g,r:g},fig:f[0]}],f[1],0),["b0.m","b0.r"]];
}
function genTask(level,mode){
  let p,bl;
  do{[p,bl]=genProg(level)}while(new Set(makeRow(p)).size<2);
  return {t:mode,p,row:makeRow(p),blanks:bl,q:mode==="legen"?"Spielen Sie das Programm in Gedanken durch und legen Sie die Reihe, die es erzeugt.":"Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt."};
}
let G={level:1,mode:"legen",streak:0};
function renderGen(v){
  v.append(el("div","kicker","Generator · beliebig viele Muster"),el("h2",null,"Neue Muster üben"));
  v.append(el("p",null,"Wählen Sie Schwierigkeit und Aufgabentyp. Jedes Muster wird zufällig erzeugt, die Generator-Aufgaben zählen nicht zum Fortschritt der Stufen."));
  const c=el("div","ctls"),hold=el("div"),tr=el("p","mono");
  const seg=(label,items,key)=>{
    const w=el("div","ctl"),s=el("div","seg");w.append(el("span","lb",label),s);
    items.forEach(([v,t])=>{const b=btn(t,null,()=>{G[key]=v;s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));next()});b.setAttribute("aria-pressed",G[key]===v);s.append(b)});
    c.append(w);
  };
  seg("Schwierigkeit",[[1,"Eine Grenze"],[2,"Zwei Grenzen"],[3,"Reste"],[4,"Drei Figuren"]],"level");
  seg("Aufgabe",[["legen","Reihe legen"],["bauen","Programm ergänzen"]],"mode");
  const drawTr=()=>tr.innerHTML='<code>treffer = '+G.streak+'</code>';
  function next(){
    const a=renderTask(genTask(G.level,G.mode),()=>{G.streak++;drawTr()});
    hold.replaceChildren(a);
    a.querySelector(".acts").append(btn("Neues Muster","btn ghost",next));
  }
  v.append(c,tr,hold);drawTr();next();
}

/* Ansicht */
let cur=STUFEN[0].id;
function renderView(){
  const v=document.getElementById("view");v.innerHTML="";
  if(cur==="generator"){renderGen(v);return}
  const i=STUFEN.findIndex(s=>s.id===cur),s=STUFEN[i];
  v.append(el("div","kicker","Stufe "+(i+1)+" von 4 · "+s.niveau),el("h2",null,s.titel));
  s.intro.forEach(p=>v.append(el("p",null,p)));
  if(s.resttable){
    const{m,n}=s.resttable,w=el("div","tbl"),t=el("table");let a="<tr><th>x</th>",b="<tr><th>x % "+m+"</th>";
    for(let x=1;x<=n;x++){a+="<td>"+x+"</td>";b+='<td class="'+(x%m===0?"hi":"")+'">'+x%m+"</td>"}
    t.innerHTML=a+"</tr>"+b+"</tr>";w.append(t);v.append(w);
  }
  v.append(simWidget(s.sim,"Beispiel Schritt für Schritt"),el("p","merke","<strong>Merke:</strong> "+s.merke));
  const l=el("div","exs");s.ex.forEach(e=>l.append(renderTask(e)));v.append(l);
  const ft=el("div","foot"),left=el("div"),right=el("div","bar2");
  left.append(btn("Fortschritt zurücksetzen","btn ghost",function(){
    if(this.dataset.sure){solved={};save();counter();tabs();renderView();return}
    this.dataset.sure="1";this.textContent="Wirklich alles zurücksetzen?";
  }));
  if(i>0){const a=el("a","btn ghost","Zurück zu Stufe "+i);a.href="#"+STUFEN[i-1].id;right.append(a)}
  const a=el("a","btn",i<3?"Weiter zu Stufe "+(i+2):"Zum Generator");a.href=i<3?"#"+STUFEN[i+1].id:"#generator";right.append(a);
  ft.append(left,right);v.append(ft);
}
function route(first){
  const h=location.hash.slice(1);
  cur=h==="generator"||STUFEN.some(s=>s.id===h)?h:STUFEN[0].id;
  renderView();tabs();counter();
  if(!first)document.querySelector(".tabs").scrollIntoView({block:"start"});
}
document.getElementById("hero").append(...[..."QQQDDDQQQ"].map((f,i)=>slot(i,f)));
addEventListener("hashchange",()=>route(false));
window.figurenmuster={makeRow,genTask};
route(true);
})();
