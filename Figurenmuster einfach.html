<script>
(function(){
const STUFEN=JSON.parse(document.getElementById("daten").textContent),KEY="figurenmuster-einfach-v1";
const TOTAL=STUFEN.reduce((a,s)=>a+s.ex.length,0);
const NAME={Q:"Quadrat",D:"Dreieck",K:"Kreis"},MIT={Q:"ein Quadrat",D:"ein Dreieck",K:"einen Kreis"},FIGS=["Q","D","K"];
const TYP={legen:"Reihe legen",bauen:"Programm ergänzen",wahl:"Programm wählen",zaehl:"Zähler verfolgen"};
let solved={};
try{solved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){solved={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(solved))}catch(e){}}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function btn(t,c,f){const b=el("button",c===null?"":(c||"btn"),t);b.type="button";if(f)b.addEventListener("click",f);return b}
function clone(o){return JSON.parse(JSON.stringify(o))}
function svg(f){
  const s={Q:'<rect x="3" y="3" width="18" height="18" rx="1" fill="var(--q)"/>',D:'<polygon points="12,3 22.5,21 1.5,21" fill="var(--d)"/>',K:'<circle cx="12" cy="12" r="9.5" fill="var(--k)"/>'}[f];
  return '<svg class="fg" viewBox="0 0 24 24" role="img" aria-label="'+NAME[f]+'">'+s+'</svg>';
}

/* Programm-Modell: Liste von Anweisungen fig, rep, set, inc */
const KEYOF={fig:"f",rep:"n",set:"v"};
function walk(p,fn){p.forEach(s=>{fn(s);if(s.t==="rep")walk(s.body,fn)})}
function runProg(p){
  const st={x:undefined,row:""};
  const go=l=>l.forEach(s=>{
    if(s.t==="fig")st.row+=s.f;
    else if(s.t==="set")st.x=s.v;
    else if(s.t==="inc")st.x++;
    else{const n=s.n==="x"?st.x:s.n;for(let i=0;i<n;i++)go(s.body)}
  });
  go(p);return st;
}
function complete(p){let ok=true;walk(p,s=>{const k=KEYOF[s.t];if(k&&s[k]==null)ok=false});return ok}
function blanked(p){const c=clone(p);walk(c,s=>{if(s.blank)s[KEYOF[s.t]]=null});return c}
function fillIn(c,sol){const a=[],b=[];walk(c,s=>a.push(s));walk(sol,s=>b.push(s));a.forEach((s,i)=>{const k=KEYOF[s.t];if(k)s[k]=b[i][k]})}
const RANGE={n:[1,12],v:[0,5],ans:[0,30]};

function stepper(get,set,lo,hi){
  const box=el("span","blank"),v=el("span","v");
  const draw=()=>{const c=get();v.textContent=c==null?"?":c;box.classList.toggle("empty",c==null)};
  const step=d=>{const c=get();set(c==null?(d>0?lo:hi):Math.min(hi,Math.max(lo,c+d)));draw()};
  const m=btn("−",null,()=>step(-1)),q=btn("+",null,()=>step(1));
  m.setAttribute("aria-label","Wert verkleinern");q.setAttribute("aria-label","Wert vergrössern");
  box.append(m,v,q);draw();return box;
}
/* Darstellung: jede Zeile bekommt ihren Pfad als Kennung */
function renderProg(p,ctx){
  ctx=ctx||{};const w=el("div","prog");
  const line=(depth,id,fill)=>{const d=el("div","pl"+(ctx.on===id?" on":""));d.append(document.createTextNode("    ".repeat(depth)));fill(d);w.append(d)};
  const html=(d,h)=>d.insertAdjacentHTML("beforeend",h);
  const num=(d,s,key,r)=>{
    if(ctx.edit&&s.blank)d.append(stepper(()=>s[key],v=>s[key]=v,r[0],r[1]));
    else html(d,'<span class="n">'+s[key]+'</span>');
  };
  const go=(l,depth,pre)=>l.forEach((s,i)=>{
    const id=pre+i;
    if(s.t==="set")line(depth,id,d=>{html(d,"x = ");num(d,s,"v",RANGE.v)});
    else if(s.t==="inc")line(depth,id,d=>html(d,'x = x + <span class="n">1</span>'));
    else if(s.t==="fig")line(depth,id,d=>{
      if(ctx.edit&&s.blank){
        const b=btn("?","figb",()=>{s.f=FIGS[(FIGS.indexOf(s.f)+1)%3];dr()});
        const dr=()=>{b.innerHTML=s.f?svg(s.f):"?";b.setAttribute("aria-label",s.f?"Figur "+NAME[s.f]+", klicken zum Wechseln":"Figur wählen")};
        dr();d.append(b);
      }else html(d,'<span class="fi">'+svg(s.f)+'</span>');
    });
    else{
      line(depth,id,d=>{
        html(d,'<span class="k">repeat</span> ');
        if(s.n==="x")html(d,"x");else num(d,s,"n",RANGE.n);
        html(d,":");
      });
      go(s.body,depth+1,id+".");
    }
  });
  go(p,0,"");return w;
}
function slot(i,f,o){
  o=o||{};const s=el("div","slot"),c=el("div","cellbox"+(o.cls?" "+o.cls:""));if(f)c.innerHTML=svg(f);
  s.append(c,el("span","xn",String(i+1)));return s;
}
function rowEl(str,o){
  o=o||{};const r=el("div","row");
  for(let i=0;i<(o.len||str.length);i++)r.append(slot(i,str[i],{cls:o.cls&&o.cls(i)}));
  r.setAttribute("aria-label","Reihe: "+Array.from(str).map(f=>NAME[f]).join(", "));return r;
}

/* Ablauf */
function frames(p){
  const F=[];let x=null,row="";
  const add=(on,note,e)=>F.push(Object.assign({on,note,x,row},e||{}));
  add(null,"Das Programm startet. Die Reihe ist noch leer. Klicken Sie auf <b>Weiter</b>.");
  const go=(l,depth,pre)=>l.forEach((s,i)=>{
    const id=pre+i;
    if(s.t==="set"){x=s.v;add(id,"Der Zähler <code>x</code> erhält den Startwert "+x+".")}
    else if(s.t==="inc"){const o=x;x++;add(id,"<code>x = x + 1</code>: Aus "+o+" wird "+x+".")}
    else if(s.t==="fig"){row+=s.f;add(id,"Die Reihe erhält "+MIT[s.f]+".",{fresh:true})}
    else{
      const n=s.n==="x"?x:s.n,pref=s.n==="x"?"<code>x</code> ist "+x+", also läuft diese Schleife "+(x===1?"einmal":x+" Mal")+". ":"";
      for(let k=1;k<=n;k++){add(id,(k===1?pref:"")+"<b>"+(depth?"Innere Schleife, ":"")+"Durchlauf "+k+" von "+n+".</b>");go(s.body,depth+1,id+".")}
    }
  });
  go(p,0,"");
  add(null,"Das Programm ist fertig."+(x!=null?" <code>x</code> hat am Schluss den Wert "+x+".":""));
  return F;
}
function simWidget(p,title){
  const F=frames(p),hasX=F.some(f=>f.x!=null),len=runProg(p).row.length;let i=0;
  const w=el("section","sim");w.setAttribute("aria-label",title);w.append(el("h3",null,title));
  const g=el("div","simg"),a=el("div"),b=el("div");
  a.innerHTML='<div class="lbl">Programm</div>';
  const pw=el("div"),xb=el("div","xbox"),rl=el("div","lbl","Reihe"),rw=el("div");
  a.append(pw);
  if(hasX){const xl=el("div","lbl","Zähler x");rl.style.marginTop="12px";b.append(xl,xb)}
  b.append(rl,rw);g.append(a,b);
  const note=el("p","note");note.setAttribute("aria-live","polite");
  const back=btn("Zurück","btn ghost",()=>go(i-1)),next=btn("Weiter","btn",()=>go(i+1)),again=btn("Von vorne","btn ghost",()=>go(0)),pos=el("span","pos");
  const bar=el("div","simbar");bar.append(back,next,again,pos);w.append(g,note,bar);
  function go(n){
    i=Math.max(0,Math.min(F.length-1,n));const f=F[i];
    pw.replaceChildren(renderProg(p,{on:f.on}));
    xb.textContent=f.x==null?"noch leer":f.x;
    rw.replaceChildren(rowEl(f.row,{len,cls:k=>f.fresh&&k===f.row.length-1?"new":k===f.row.length?"next":""}));
    rw.style.setProperty("--s","34px");
    note.innerHTML=f.note;pos.textContent="Schritt "+i+" von "+(F.length-1);
    back.disabled=i===0;next.disabled=i===F.length-1;
  }
  go(0);return w;
}

/* Fortschritt */
function counter(flash){
  const c=document.getElementById("counter"),plain='geloest = <b>'+Object.keys(solved).length+'</b> <span># von '+TOTAL+'</span>';
  if(flash){c.innerHTML="geloest = geloest + 1";clearTimeout(counter.t);counter.t=setTimeout(()=>c.innerHTML=plain,1100)}else c.innerHTML=plain;
}
function tabs(){
  const ol=document.getElementById("tabs");ol.innerHTML="";
  STUFEN.forEach((s,i)=>{
    const d=s.ex.filter(e=>solved[e.id]).length,li=el("li"),a=el("a");a.href="#"+s.id;
    if(s.id===cur)a.setAttribute("aria-current","page");
    a.setAttribute("aria-label","Stufe "+(i+1)+", "+s.name+", "+d+" von "+s.ex.length+" gelöst");
    a.innerHTML='<span class="pr">'+(i+1)+' · '+d+'/'+s.ex.length+'</span><span class="nm">'+s.name+'</span><span class="bar"><i style="--p:'+d/s.ex.length*100+'%"></i></span>';
    li.append(a);ol.append(li);
  });
  const li=el("li"),a=el("a");a.href="#generator";if(cur==="generator")a.setAttribute("aria-current","page");
  a.innerHTML='<span class="pr">neu</span><span class="nm">Generator</span>';li.append(a);ol.append(li);
}
function setSolved(e,art){
  if(!e.id||solved[e.id])return;
  solved[e.id]=1;save();art.querySelector(".st").textContent="✓ gelöst";counter(true);tabs();
}

/* Aufgaben */
function feedback(art){const f=el("div","fb");f.hidden=true;f.setAttribute("role","status");art.append(f);return f}
function show(f,k,h){f.className="fb "+k;f.innerHTML=h;f.hidden=false}
function afterSolve(art,p,hold){
  if(art.querySelector(".abl"))return;
  const b=btn("Ablauf ansehen","btn ghost abl",function(){
    const open=hold.firstChild;hold.replaceChildren();if(!open)hold.append(simWidget(p(),"Ablauf"));
    this.textContent=open?"Ablauf ansehen":"Ablauf ausblenden";
  });
  art.querySelector(".acts").append(b);
}
function renderTask(e,onOk){
  const art=el("article","ex");if(e.id)art.id="ex-"+e.id.replace(".","-");
  art.innerHTML='<div class="exh"><span class="id">'+(e.id||"neu")+'</span><span>'+TYP[e.t]+'</span><span class="st">'+(e.id&&solved[e.id]?"✓ gelöst":"")+'</span></div>';
  art.append(el("p","q",e.q));
  const ok=()=>{setSolved(e,art);if(onOk)onOk()};
  ({legen:rLegen,bauen:rBauen,wahl:rWahl,zaehl:rZaehl})[e.t](e,art,ok);
  return art;
}
function rLegen(e,art,ok){
  const target=e.row,n=target.length;let c="",wrong=-1;
  art.append(renderProg(e.p));
  const rw=el("div"),pal=el("div","pal");
  const draw=()=>rw.replaceChildren(rowEl(c,{len:n,cls:i=>i===wrong?"wrong":i===c.length?"next":""}));
  FIGS.forEach(f=>{const b=btn(svg(f),"palb",()=>{if(c.length<n){c+=f;wrong=-1;draw()}});b.setAttribute("aria-label",NAME[f]+" anhängen");pal.append(b)});
  pal.append(btn("Letzte entfernen","btn ghost",()=>{c=c.slice(0,-1);wrong=-1;draw()}),btn("Alles leeren","btn ghost",()=>{c="";wrong=-1;draw()}));
  const lab=el("div","rowlabel","Ihre Reihe");lab.style.marginBottom="-8px";
  art.append(lab,rw,pal);draw();
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  acts.append(btn("Prüfen","btn",()=>{
    if(c.length<n){show(box,"no","Die Reihe hat "+n+" Figuren. Legen Sie zuerst alle Figuren.");return}
    if(c===target){wrong=-1;draw();show(box,"ok","<b>✓ Richtig.</b> Das Programm erzeugt genau diese Reihe.");ok();afterSolve(art,()=>e.p,hold)}
    else{wrong=[...c].findIndex((f,i)=>f!==target[i]);draw();show(box,"no","<b>✗ Figur "+(wrong+1)+" stimmt nicht.</b> Gehen Sie das Programm nochmals Zeile für Zeile durch.")}
  }),btn("Lösung zeigen","btn ghost",()=>{c=target;wrong=-1;draw();show(box,"sol","Dies ist die richtige Reihe. Sehen Sie im Ablauf nach, wie sie entsteht.");afterSolve(art,()=>e.p,hold)}));
}
function rBauen(e,art,ok){
  const p=blanked(e.p);
  const lab=el("div","rowlabel","Vorlage");lab.style.marginBottom="-8px";
  art.append(lab,rowEl(e.row));
  let pv=renderProg(p,{edit:true});art.append(pv);
  const res=el("div");art.append(res);
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  acts.append(btn("Prüfen","btn",()=>{
    if(!complete(p)){show(box,"no","Füllen Sie zuerst alle Felder mit dem Fragezeichen aus.");res.replaceChildren();return}
    const r=runProg(p).row,t=e.row;let d=-1;
    for(let i=0;i<Math.max(r.length,t.length);i++)if(r[i]!==t[i]){d=i;break}
    res.replaceChildren(el("div","rowlabel","Ihr Programm erzeugt"),rowEl(r,{cls:i=>i===d?"wrong":""}));
    if(d<0){show(box,"ok","<b>✓ Richtig.</b> Ihr Programm erzeugt genau die Vorlage.");ok();afterSolve(art,()=>clone(p),hold)}
    else if(r.length!==t.length)show(box,"no","<b>✗ Die Länge stimmt nicht.</b> Die Vorlage hat "+t.length+" Figuren, Ihr Programm erzeugt "+r.length+".");
    else show(box,"no","<b>✗ Ab Figur "+(d+1)+" weicht die Reihe ab.</b> Vergleichen Sie die Gruppen.");
  }),btn("Lösung zeigen","btn ghost",()=>{
    fillIn(p,e.p);const nv=renderProg(p,{edit:true});pv.replaceWith(nv);pv=nv;res.replaceChildren();
    show(box,"sol","Dies ist eine richtige Lösung.");afterSolve(art,()=>clone(p),hold);
  }));
}
function seed(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rWahl(e,art,ok){
  art.append(rowEl(e.row));
  const list=[e.p].concat(e.alt).map((p,i)=>({p,i}));
  list.sort((a,b)=>seed(e.id+a.i)-seed(e.id+b.i));
  const fs=el("fieldset","opts"),leg=el("legend",null,"Programm wählen"),name="w"+e.id.replace(".","_");
  leg.style.cssText="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)";fs.append(leg);
  list.forEach((o,k)=>{
    const l=el("label","opt"),r=el("input");r.type="radio";r.name=name;r.value=o.i;r.id=name+"_"+k;
    const t=el("span","lab");t.append(r,document.createTextNode("Programm "+"ABC"[k]));
    l.append(t,renderProg(o.p));fs.append(l);
  });
  art.append(fs);
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  acts.append(btn("Prüfen","btn",()=>{
    const c=fs.querySelector("input:checked");
    if(!c){show(box,"no","Wählen Sie zuerst ein Programm.");return}
    if(+c.value===0){show(box,"ok","<b>✓ Richtig.</b> Dieses Programm erzeugt die Reihe.");ok();afterSolve(art,()=>e.p,hold)}
    else{show(box,"no","<b>✗ Dieses Programm erzeugt eine andere Reihe:</b>");box.append(rowEl(runProg(e.alt[+c.value-1]).row))}
  }));
}
function rZaehl(e,art,ok){
  art.append(renderProg(e.p));
  let a=null;const w=el("div","pl");w.style.padding="0";w.append(document.createTextNode("x = "),stepper(()=>a,v=>a=v,RANGE.ans[0],RANGE.ans[1]));
  w.className="mono";art.append(w);
  const acts=el("div","bar2 acts");art.append(acts);const box=feedback(art),hold=el("div");art.append(hold);
  acts.append(btn("Prüfen","btn",()=>{
    if(a==null){show(box,"no","Stellen Sie zuerst einen Wert ein.");return}
    if(a===e.x){show(box,"ok","<b>✓ Richtig.</b> <code>x</code> hat am Schluss den Wert "+e.x+".");ok();afterSolve(art,()=>e.p,hold)}
    else show(box,"no","<b>✗ Noch nicht.</b> Wie oft läuft die Zeile <code>x = x + 1</code> tatsächlich?");
  }),btn("Lösung zeigen","btn ghost",()=>{show(box,"sol","<code>x</code> hat am Schluss den Wert "+e.x+".");afterSolve(art,()=>e.p,hold)}));
}

/* Generator */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const mix=()=>FIGS.slice().sort(()=>Math.random()-.5);
const fig=(f,bl)=>({t:"fig",f,blank:!!bl}),rep=(n,body,bl)=>({t:"rep",n,body,blank:!!bl}),set=(v,bl)=>({t:"set",v,blank:!!bl}),INC={t:"inc"};
function genProg(level){
  const f=mix();
  if(level===1){const p=[rep(ri(2,5),[fig(f[0])],true),rep(ri(2,5),[fig(f[1])],true)];if(Math.random()<.5)p.push(rep(ri(2,4),[fig(Math.random()<.5?f[0]:f[2])],true));return p}
  if(level===2){
    const a=ri(1,3),b=ri(1,2),g=x=>x;
    const part=(n,ff)=>n===1?fig(ff):rep(n,[fig(ff)],true);
    return [rep(ri(2,4),[part(a,f[0]),part(b,f[1])],true)];
  }
  if(level===3){
    const t=ri(1,4),s=t===4?ri(2,9):0;
    if(t===1)return [set(0),rep(ri(3,8),[fig(f[0]),INC])];
    if(t===2)return [set(0),rep(ri(2,5),[fig(f[0]),INC]),rep(ri(2,5),[fig(f[1]),INC])];
    if(t===3)return [set(0),rep(ri(2,4),[rep(ri(2,4),[fig(f[0])].concat(Math.random()<.5?[INC]:[])),INC])];
    return [set(s),rep(ri(3,7),[fig(f[0]),fig(f[1]),INC])];
  }
  const s=ri(1,2),o=s===2?3:ri(3,4);
  return Math.random()<.5?[set(s,true),rep(o,[rep("x",[fig(f[0])]),fig(f[1]),INC],true)]:[set(s,true),rep(o,[fig(f[1]),rep("x",[fig(f[0])]),INC],true)];
}
function genTask(level,mode){
  let p,r;do{p=genProg(level);r=runProg(p)}while(level!==3&&new Set(r.row).size<2);
  if(level===3)return {t:"zaehl",p,row:r.row,x:r.x,q:"Welchen Wert hat <code>x</code> am Schluss?"};
  return {t:mode,p,row:r.row,q:mode==="legen"?"Spielen Sie das Programm in Gedanken durch und legen Sie die Reihe, die es erzeugt.":"Ergänzen Sie das Programm so, dass es genau diese Reihe erzeugt."};
}
let G={level:1,mode:"legen",streak:0};
function renderGen(v){
  v.append(el("div","kicker","Generator · beliebig viele Muster"),el("h2",null,"Neue Muster üben"));
  v.append(el("p",null,"Wählen Sie Schwierigkeit und Aufgabentyp. Jedes Muster wird zufällig erzeugt. Beim Mitzählen bestimmen Sie immer den Endwert von <code>x</code>. Generator-Aufgaben zählen nicht zum Fortschritt der Stufen."));
  const c=el("div","ctls"),hold=el("div"),tr=el("p","mono");
  const seg=(label,items,key)=>{
    const w=el("div","ctl"),s=el("div","seg");w.append(el("span","lb",label),s);
    items.forEach(([val,t])=>{const b=btn(t,null,()=>{G[key]=val;s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));next()});b.setAttribute("aria-pressed",G[key]===val);s.append(b)});
    c.append(w);
  };
  seg("Schwierigkeit",[[1,"Nacheinander"],[2,"Gruppen wiederholen"],[3,"Mitzählen"],[4,"Wachsende Muster"]],"level");
  seg("Aufgabe",[["legen","Reihe legen"],["bauen","Programm ergänzen"]],"mode");
  const drawTr=()=>tr.innerHTML='<code>treffer = '+G.streak+'</code>';
  function next(){
    const a=renderTask(genTask(G.level,G.mode),()=>{G.streak++;drawTr()});
    hold.replaceChildren(a);a.querySelector(".acts").append(btn("Neues Muster","btn ghost",next));
  }
  v.append(c,tr,hold);drawTr();next();
}

/* Ansicht */
let cur=STUFEN[0].id;
function renderView(){
  const v=document.getElementById("view");v.innerHTML="";
  if(cur==="generator"){renderGen(v);return}
  const i=STUFEN.findIndex(s=>s.id===cur),s=STUFEN[i];
  v.append(el("div","kicker","Stufe "+(i+1)+" von 4 · "+s.niveau),el("h2",null,s.titel));
  s.intro.forEach(p=>v.append(el("p",null,p)));
  v.append(simWidget(s.sim,"Beispiel Schritt für Schritt"),el("p","merke","<strong>Merke:</strong> "+s.merke));
  const l=el("div","exs");s.ex.forEach(e=>l.append(renderTask(e)));v.append(l);
  const ft=el("div","foot"),left=el("div"),right=el("div","bar2");
  left.append(btn("Fortschritt zurücksetzen","btn ghost",function(){
    if(this.dataset.sure){solved={};save();counter();tabs();renderView();return}
    this.dataset.sure="1";this.textContent="Wirklich alles zurücksetzen?";
  }));
  if(i>0){const a=el("a","btn ghost","Zurück zu Stufe "+i);a.href="#"+STUFEN[i-1].id;right.append(a)}
  const a=el("a","btn",i<3?"Weiter zu Stufe "+(i+2):"Zum Generator");a.href=i<3?"#"+STUFEN[i+1].id:"#generator";right.append(a);
  ft.append(left,right);v.append(ft);
}
function route(first){
  const h=location.hash.slice(1);
  cur=h==="generator"||STUFEN.some(s=>s.id===h)?h:STUFEN[0].id;
  renderView();tabs();counter();
  if(!first)document.querySelector(".tabs").scrollIntoView({block:"start"});
}
document.getElementById("hero").append(...[..."QQQDDDQQQ"].map((f,i)=>slot(i,f)));
addEventListener("hashchange",()=>route(false));
window.figurenmuster={runProg,genTask};
route(true);
})();
